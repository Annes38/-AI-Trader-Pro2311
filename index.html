<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Trader Pro</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#080b12;color:#fff}
.container{max-width:950px;margin:auto;padding:18px}
header{text-align:center;margin-bottom:20px}
header h1{margin:0 0 7px;font-size:30px}
header p{color:#8d96a8}
.card{background:#111722;border:1px solid #202938;border-radius:18px;padding:18px;margin-bottom:16px}
select{width:100%;padding:14px;background:#0b1018;color:#fff;border:1px solid #303949;border-radius:10px;font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:18px}
.pair{font-size:21px;font-weight:bold}
.price{font-size:28px;font-weight:bold;margin-top:7px}
.signal{padding:12px 22px;border-radius:12px;font-size:21px;font-weight:bold;background:#3a3215;color:#ffd84d}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.box{background:#0b1018;border:1px solid #202938;border-radius:12px;padding:14px}
.label{color:#8d96a8;font-size:12px;margin-bottom:7px}
.value{font-size:17px;font-weight:bold}
.bar{height:10px;background:#252d3b;border-radius:20px;margin-top:8px;overflow:hidden}
.fill{height:100%;width:0%;transition:.4s}
.info{text-align:center;color:#8d96a8;font-size:12px;margin-top:18px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}}
</style>
</head>

<body>
<div class="container">

<header>
<h1>🤖 AI Trader Pro</h1>
<p>Real-Time Crypto Market Analysis</p>
</header>

<div class="card">
<div class="label">SELECT MARKET</div>
<select id="symbol">
<option value="BTCUSDT">BTC / USDT</option>
<option value="ETHUSDT">ETH / USDT</option>
<option value="SOLUSDT">SOL / USDT</option>
<option value="BNBUSDT">BNB / USDT</option>
<option value="XRPUSDT">XRP / USDT</option>
<option value="ADAUSDT">ADA / USDT</option>
<option value="DOGEUSDT">DOGE / USDT</option>
</select>
</div>

<div class="card">

<div class="top">
<div>
<div class="pair" id="pair">BTC / USDT</div>
<div class="price" id="price">Loading...</div>
</div>
<div class="signal" id="signal">WAIT</div>
</div>

<div class="grid">

<div class="box">
<div class="label">ENTRY</div>
<div class="value" id="entry">--</div>
</div>

<div class="box">
<div class="label">STOP LOSS</div>
<div class="value" id="sl">--</div>
</div>

<div class="box">
<div class="label">TAKE PROFIT</div>
<div class="value" id="tp">--</div>
</div>

<div class="box">
<div class="label">RSI (14)</div>
<div class="value" id="rsi">--</div>
</div>

<div class="box">
<div class="label">EMA 20</div>
<div class="value" id="ema20">--</div>
</div>

<div class="box">
<div class="label">EMA 50</div>
<div class="value" id="ema50">--</div>
</div>

</div>

<div style="margin-top:18px">
<div class="label">SIGNAL STRENGTH</div>
<div class="bar"><div class="fill" id="bar"></div></div>
<div style="margin-top:7px" id="confidence">0%</div>
</div>

</div>

<div class="info" id="status">
Connecting to Binance...
</div>

</div>

<script>
const symbol=document.getElementById("symbol");

const priceEl=document.getElementById("price");
const pairEl=document.getElementById("pair");
const signalEl=document.getElementById("signal");
const statusEl=document.getElementById("status");

const entryEl=document.getElementById("entry");
const slEl=document.getElementById("sl");
const tpEl=document.getElementById("tp");

const rsiEl=document.getElementById("rsi");
const ema20El=document.getElementById("ema20");
const ema50El=document.getElementById("ema50");

const barEl=document.getElementById("bar");
const confidenceEl=document.getElementById("confidence");

function sma(data,n){
 if(data.length<n)return null;
 let s=0;
 for(let i=data.length-n;i<data.length;i++)s+=data[i];
 return s/n;
}

function ema(data,n){
 if(data.length<n)return null;

 const k=2/(n+1);
 let e=sma(data.slice(0,n),n);

 for(let i=n;i<data.length;i++){
   e=data[i]*k+e*(1-k);
 }
 return e;
}

function rsi(data,n=14){
 if(data.length<=n)return null;

 let gain=0,loss=0;

 for(let i=1;i<=n;i++){
   const d=data[i]-data[i-1];
   if(d>=0)gain+=d;
   else loss-=d;
 }

 let avgGain=gain/n;
 let avgLoss=loss/n;

 for(let i=n+1;i<data.length;i++){
   const d=data[i]-data[i-1];

   const g=d>0?d:0;
   const l=d<0?-d:0;

   avgGain=(avgGain*(n-1)+g)/n;
   avgLoss=(avgLoss*(n-1)+l)/n;
 }

 if(avgLoss===0)return 100;

 const rs=avgGain/avgLoss;
 return 100-(100/(1+rs));
}

function fmt(x){
 if(x===null||x===undefined)return "--";
 return Number(x).toLocaleString(undefined,{
   minimumFractionDigits:2,
   maximumFractionDigits:6
 });
}

async function analyze(){

 const sym=symbol.value;

 pairEl.textContent=sym.replace("USDT"," / USDT");

 try{

   const response=await fetch(
    `https://api.binance.com/api/v3/klines?symbol=${sym}&interval=5m&limit=100`
   );

   const candles=await response.json();

   if(!Array.isArray(candles)||candles.length<50)
     throw new Error("Not enough data");

   const closes=candles.map(x=>Number(x[4]));
   const price=closes[closes.length-1];

   const e20=ema(closes,20);
   const e50=ema(closes,50);
   const r=rsi(closes,14);

   priceEl.textContent="$"+fmt(price);
   ema20El.textContent=fmt(e20);
   ema50El.textContent=fmt(e50);
   rsiEl.textContent=fmt(r);

   let score=0;

   if(price>e20)score+=25;
   else score-=25;

   if(e20>e50)score+=25;
   else score-=25;

   if(r>50&&r<70)score+=25;
   else if(r<50&&r>30)score-=25;

   const strength=Math.min(100,Math.abs(score));

   let signal="WAIT";

   if(score>=50)signal="BUY";
   else if(score<=-50)signal="SELL";

   signalEl.textContent=signal;

   signalEl.style.background=
     signal==="BUY"?"#123c2a":
     signal==="SELL"?"#421b22":"#3a3215";

   signalEl.style.color=
     signal==="BUY"?"#35e28b":
     signal==="SELL"?"#ff6575":"#ffd84d";

   confidenceEl.textContent=strength+"%";
   barEl.style.width=strength+"%";

   if(signal==="BUY"){
     entryEl.textContent=fmt(price);
     slEl.textContent=fmt(price*0.99);
     tpEl.textContent=fmt(price*1.02);
   }else if(signal==="SELL"){
     entryEl.textContent=fmt(price);
     slEl.textContent=fmt(price*1.01);
     tpEl.textContent=fmt(price*0.98);
   }else{
     entryEl.textContent="WAIT";
     slEl.textContent="--";
     tpEl.textContent="--";
   }

   statusEl.textContent=
    "Live Binance data • 5m timeframe • Updated "+new Date().toLocaleTimeString();

 }catch(error){

   statusEl.textContent="Unable to load Binance data";

   console.error(error);
 }
}

symbol.addEventListener("change",analyze);

analyze();

setInterval(analyze,15000);
</script>

</body>
</html>
